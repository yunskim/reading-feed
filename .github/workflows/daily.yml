name: Daily Reading Discovery
on:
  schedule:
    - cron: '15 0 * * *' # 09:15 Asia/Seoul
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reading-feed-writes
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and rank articles
        run: python scripts/discover.py
      - name: Build and validate RSS
        run: |
          python scripts/build.py
          python -c "import glob,xml.etree.ElementTree as E; [E.parse(p) for p in glob.glob('docs/*.xml')]"
      - name: Commit new recommendations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json docs
          if git diff --cached --quiet; then
            echo "No new articles today"
            exit 0
          fi
          git commit -m "feed: daily curated reading update"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
