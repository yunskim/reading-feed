name: Build RSS
on:
  push:
    branches: [main]
    paths:
      - 'data/articles.json'
      - 'scripts/build.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate feeds
        run: python scripts/build.py
      - name: Validate XML
        run: python -c "import glob,xml.etree.ElementTree as E; [E.parse(p) for p in glob.glob('docs/*.xml')]"
      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "build: update curated RSS feeds"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep 2
            done
            echo "Could not push generated feeds after retries" >&2
            exit 1
          fi
